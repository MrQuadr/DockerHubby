version: "3.9"

services:

  hysteria:
    image: tobyxdd/hysteria
    container_name: hysteria
    environment:
      - ADDR_VPN=${ADDR_VPN}
      - PORT_WARP=${PORT_WARP}
      - E_MAIL=${E_MAIL}
    restart: always
    network_mode: "host"
    command: ["server", "-c", "/etc/hysteria.yaml"]
    volumes:
      - acme:/acme
      - ./hysteria.yaml:/etc/hysteria.yaml

  warp:
    build:
      context: .
      dockerfile: docker-warp
    container_name: warp
    restart: always
#    devices:
#      - /dev/net/tun:/dev/net/tun
    device_cgroup_rules:
      - 'c 10:200 rwm'
    ports:
      - "${PORT_WARP}:${PORT_WARP}"
    environment:
      - WARP_SLEEP=2
      - PORT_WARP=${PORT_WARP}
      # - WARP_LICENSE_KEY= # optional
      # - WARP_ENABLE_NAT=1 # enable nat
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
#      - NET_RAW
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      # uncomment for nat
      # - net.ipv4.ip_forward=1
      # - net.ipv6.conf.all.forwarding=1
      # - net.ipv6.conf.all.accept_ra=2
    volumes:
      - ./data:/var/lib/cloudflare-warp

volumes:
  acme:
